jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 新增步骤：获取官方最新版本号
      - name: Get latest dsh version from npm
        id: dsh_version
        run: |
          VERSION=$(npm view @deepseek-ai/dsh version)
          echo "DSH_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Latest dsh version is $VERSION"

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.DSH_VERSION }}
          # 将版本号传递给 Dockerfile
          build-args: |
            DSH_VERSION=${{ env.DSH_VERSION }}
