name: Auto Build dsh Docker Image

on:
  schedule:
    - cron: '0 19 * * *' # 每天北京时间 03:00 自动检查更新
  workflow_dispatch: # 允许手动触发
    inputs:
      channel:
        description: 'npm dist-tag：next（官方新版都在这）/ latest / alpha'
        required: false
        default: 'next'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # 只传版本号：镜像名里含 DOCKERHUB_USERNAME（=melanrabbit）这个 secret 值，
      # 一经登记为 secret，GitHub 就把整条 output 值抹空（详见 verify-image 上方注释）。
      version: ${{ steps.dsh_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 关键：必须带 dist-tag 取版本。裸 `npm view @deepseek-ai/dsh version` 等价于
      # @latest，而官方的预发布版本挂在 `next` 上（2026-10：latest=0.2.0-rc.2，
      # next=0.2.1-rc.2），结果就是「每天都构建，但永远构建 0.2.0-rc.2」。
      - name: Resolve dsh version
        id: dsh_version
        run: |
          npm config set registry https://registry.npmmirror.com
          CHANNEL="${{ github.event.inputs.channel || 'next' }}"
          VERSION="$(npm view "@deepseek-ai/dsh@${CHANNEL}" version)"
          test -n "$VERSION"
          echo "channel=$CHANNEL -> dsh $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 双推：GHCR（原有）+ Docker Hub（用户 fnOS 的「有新版本」检测只认 docker.io，
      # 见 HANDOFF 与项目档案 106f4a70）。两个名字都是 owner/name 小写。
      - name: Set lowercase image names
        id: image
        run: |
          OWNER="$(echo '${{ github.repository }}' | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')"
          NAME="$(echo '${{ github.repository }}' | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')"
          DH_USER="$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')"
          test -n "$DH_USER" || { echo "::error::缺 secrets.DOCKERHUB_USERNAME"; exit 1; }
          echo "ghcr=ghcr.io/$OWNER/$NAME" >> "$GITHUB_OUTPUT"
          echo "dockerhub=docker.io/$DH_USER/$NAME" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ghcr }}:latest
            ${{ steps.image.outputs.ghcr }}:${{ steps.dsh_version.outputs.version }}
            ${{ steps.image.outputs.dockerhub }}:latest
            ${{ steps.image.outputs.dockerhub }}:${{ steps.dsh_version.outputs.version }}
          build-args: |
            DSH_VERSION=${{ steps.dsh_version.outputs.version }}

  # 构建绿了不等于镜像能跑：真正的验证是把镜像跑起来，看容器起没起、认证开关有没有
  # 生效、Host 信任围栏有没有被误关。历史上正是「CI 全绿但一升级容器起不来」这类问题。
  #
  # 注意（2026-10-18 实测踩坑）：镜像名**不能**经 job outputs 传给本作业。
  # DOCKERHUB_USERNAME=melanrabbit 一旦登记成 secret，GitHub 就把 outputs 里含该字符串的
  # 整条值抹成空串（同一字符串在日志里显示为 ***），于是这里拿到 `:0.2.1-rc.2` 而不是
  # `ghcr.io/...:0.2.1-rc.2`，docker 直接 "invalid reference format"。改为本作业内自己拼。
  verify-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.build-and-push.outputs.version }}

    steps:
      - name: 组装镜像名（GHCR + Docker Hub）
        run: |
          set -eu
          OWNER_L="$(echo '${{ github.repository }}' | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')"
          NAME_L="$(echo '${{ github.repository }}' | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')"
          DH_USER_L="$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_GHCR=ghcr.io/$OWNER_L/$NAME_L:$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_DH=docker.io/$DH_USER_L/$NAME_L:$VERSION" >> "$GITHUB_ENV"

      - name: 镜像名自检（防 secret 抹值把名字吃掉）
        run: |
          set -eu
          echo "GHCR      = $IMAGE_GHCR"
          echo "Docker Hub= $IMAGE_DH"
          case "$IMAGE_GHCR" in ghcr.io/*/*:*) ;; *) echo "::error::IMAGE_GHCR 组装失败：'$IMAGE_GHCR'"; exit 1 ;; esac
          case "$IMAGE_DH" in docker.io/*/*:*) ;; *) echo "::error::IMAGE_DH 组装失败：'$IMAGE_DH'"; exit 1 ;; esac

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 两个仓库都得有这个 tag（否则说明只推成功了一半）
        run: |
          set -eu
          for REF in "$IMAGE_GHCR" "$IMAGE_DH"; do
            docker manifest inspect "$REF" > /dev/null
            echo "✓ $REF 存在"
          done

      - name: 默认模式：容器应起来且仍在要认证（预期 401）· 跑 Docker Hub 那份
        run: |
          set -eu
          IMAGE="$IMAGE_DH"   # 飞牛 fnOS 拉的就是这一份，优先验收它
          docker run -d --name dsh-default -p 13080:3080 -e PUID=1001 -e PGID=1001 "$IMAGE"
          CODE=000
          for i in $(seq 1 60); do
            CODE="$(curl -s -o /dev/null -m 3 -w '%{http_code}' -H 'Host: 127.0.0.1:13080' http://127.0.0.1:13080/ || true)"
            [ "$CODE" != "000" ] && break
            docker ps --filter name=dsh-default --format '{{.Status}}' | grep -q Up || break
            sleep 2
          done
          echo "默认模式 HTTP=$CODE"
          if [ "$CODE" != "401" ]; then
            echo "::error::预期 401（认证开着），实际 $CODE，容器日志如下"
            docker logs dsh-default || true
            exit 1
          fi
          docker rm -f dsh-default

      - name: 关认证模式：应免 token（预期 200），且信任围栏仍在（伪造 Host 预期 403）· 跑 GHCR 那份
        run: |
          set -eu
          IMAGE="$IMAGE_GHCR"
          docker run -d --name dsh-noauth -p 13081:3080 \
            -e PUID=1001 -e PGID=1001 -e DSH_DISABLE_AUTH=1 -e DSH_TRUSTED_HOSTS=127.0.0.1 "$IMAGE"
          CODE=000
          for i in $(seq 1 60); do
            CODE="$(curl -s -o /dev/null -m 3 -w '%{http_code}' -H 'Host: 127.0.0.1:13081' http://127.0.0.1:13081/ || true)"
            [ "$CODE" != "000" ] && break
            docker ps --filter name=dsh-noauth --format '{{.Status}}' | grep -q Up || break
            sleep 2
          done
          echo "关认证模式 HTTP=$CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::预期 200（免 token），实际 $CODE，容器日志如下"
            docker logs dsh-noauth || true
            exit 1
          fi
          # 信任围栏只围 /api：页面外壳（/）不受 Host 围栏管，这是上游行为。
          # 所以拿 /api 探测：伪造 Host 必须 403；可信 Host 打同一个地址不能也是
          # 403（否则说明围栏把所有人都挡了，等于什么都没验证到）。
          BAD="$(curl -s -o /dev/null -m 3 -w '%{http_code}' -H 'Host: evil.example:13081' http://127.0.0.1:13081/api/__fence_probe || true)"
          GOOD="$(curl -s -o /dev/null -m 3 -w '%{http_code}' -H 'Host: 127.0.0.1:13081' http://127.0.0.1:13081/api/__fence_probe || true)"
          echo "围栏探测：伪造 Host=$BAD  可信 Host=$GOOD"
          if [ "$BAD" != "403" ]; then
            echo "::error::伪造 Host 打 /api 本应被信任围栏挡成 403，实际 $BAD：认证关了但围栏也丢了"
            docker logs dsh-noauth || true
            exit 1
          fi
          if [ "$GOOD" = "403" ]; then
            echo "::error::可信 Host 打 /api 也被挡成 403，围栏判定可疑（Host 白名单可能没生效）"
            docker logs dsh-noauth || true
            exit 1
          fi
          docker rm -f dsh-noauth
